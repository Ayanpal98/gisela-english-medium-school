<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420" width="750" height="420">
  <defs>
    <linearGradient id="madBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2329"/>
      <stop offset="45%" stop-color="#13363f"/>
      <stop offset="100%" stop-color="#164d5b"/>
    </linearGradient>
    <radialGradient id="madRadial" cx="75%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#13363f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="madDots" width="25" height="25" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <linearGradient id="mwarmAd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="750" height="420" fill="url(#madBg)"/>
  <rect width="750" height="420" fill="url(#madDots)"/>
  <rect width="750" height="420" fill="url(#madRadial)"/>

  <!-- Books Motif on Right -->
  <g transform="translate(600, 200)" opacity="0.75">
    <circle cx="0" cy="0" r="95" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="5 5" opacity="0.3"/>
    <rect x="-50" y="20" width="100" height="18" rx="3" fill="#0f766e"/>
    <rect x="-42" y="2" width="84" height="16" rx="3" fill="url(#mwarmAd)"/>
    <rect x="-35" y="-14" width="70" height="14" rx="3" fill="#38bdf8"/>
    <circle cx="0" cy="-35" r="5" fill="#fbbf24"/>
  </g>
</svg>
