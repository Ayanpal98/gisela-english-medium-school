<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 420" width="1500" height="420">
  <defs>
    <linearGradient id="adBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2329"/>
      <stop offset="45%" stop-color="#13363f"/>
      <stop offset="100%" stop-color="#164d5b"/>
    </linearGradient>
    <radialGradient id="adRadial" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#13363f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="adDots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.5" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <linearGradient id="warmAd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="420" fill="url(#adBg)"/>
  <rect width="1500" height="420" fill="url(#adDots)"/>
  <rect width="1500" height="420" fill="url(#adRadial)"/>

  <!-- Books and Reading Community Motif on Right -->
  <g transform="translate(1200, 210)" opacity="0.85">
    <circle cx="0" cy="0" r="130" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>
    <!-- Stack of Books Graphic -->
    <!-- Book 1 (bottom) -->
    <rect x="-70" y="30" width="140" height="24" rx="4" fill="#0f766e" stroke="#2dd4bf" stroke-width="1"/>
    <line x1="-50" y1="42" x2="50" y2="42" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
    <!-- Book 2 (middle) -->
    <rect x="-60" y="6" width="120" height="22" rx="4" fill="url(#warmAd)"/>
    <line x1="-40" y1="17" x2="40" y2="17" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
    <!-- Book 3 (top) -->
    <rect x="-50" y="-16" width="100" height="20" rx="4" fill="#38bdf8" stroke="#bae6fd" stroke-width="1"/>
    <!-- Open Book / Reading light above -->
    <path d="M -30 -36 Q 0 -48 0 -30 Q 0 -48 30 -36 L 26 -22 Q 0 -34 0 -18 Q 0 -34 -26 -22 Z" fill="#ffffff" opacity="0.95"/>
    <circle cx="0" cy="-60" r="7" fill="#fbbf24"/>
  </g>
</svg>
