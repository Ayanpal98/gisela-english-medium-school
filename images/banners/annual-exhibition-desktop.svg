<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 420" width="1500" height="420">
  <defs>
    <linearGradient id="exBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c231a"/>
      <stop offset="40%" stop-color="#123d2e"/>
      <stop offset="85%" stop-color="#19553f"/>
      <stop offset="100%" stop-color="#102f24"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fceda4"/>
      <stop offset="50%" stop-color="#d9aa45"/>
      <stop offset="100%" stop-color="#f3cb69"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="exGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.05"/>
    </pattern>
    <radialGradient id="sunGlow" cx="25%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#d9aa45" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#102f24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="scienceGlow" cx="80%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#102f24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1500" height="420" fill="url(#exBg)"/>
  <rect width="1500" height="420" fill="url(#exGrid)"/>
  <rect width="1500" height="420" fill="url(#sunGlow)"/>
  <rect width="1500" height="420" fill="url(#scienceGlow)"/>

  <!-- Science & Arts Decorative Graphics (Right Side) -->
  <g transform="translate(1120, 210)" opacity="0.85">
    <!-- Atom Orbits -->
    <ellipse cx="0" cy="0" rx="140" ry="50" fill="none" stroke="#4ade80" stroke-width="2" transform="rotate(30)" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="140" ry="50" fill="none" stroke="#38bdf8" stroke-width="2" transform="rotate(-30)" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="140" ry="50" fill="none" stroke="#d9aa45" stroke-width="2" transform="rotate(90)" opacity="0.6"/>
    <!-- Nucleus Glow -->
    <circle cx="0" cy="0" r="24" fill="url(#cyanAccent)" opacity="0.9"/>
    <circle cx="0" cy="0" r="10" fill="#ffffff"/>
    <!-- Electrons -->
    <circle cx="120" cy="70" r="6" fill="#fceda4"/>
    <circle cx="-120" cy="-70" r="6" fill="#38bdf8"/>
    <circle cx="0" cy="140" r="6" fill="#4ade80"/>
  </g>

  <!-- Left/Center Graphic Typography (Style A - Self-contained poster) -->
  <g transform="translate(100, 75)">
    <!-- Top Pill -->
    <rect x="0" y="0" width="360" height="32" rx="16" fill="rgba(255, 255, 255, 0.09)" stroke="rgba(217, 170, 69, 0.4)" stroke-width="1.2"/>
    <circle cx="18" cy="16" r="4.5" fill="#d9aa45"/>
    <text x="32" y="21" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#f5d77f" letter-spacing="1.5">GISELA HIGH SCHOOL • SILACHARI</text>

    <!-- Main Title -->
    <text x="0" y="80" font-family="'Manrope', sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Annual Science &amp; Cultural</text>
    <text x="0" y="132" font-family="'Manrope', sans-serif" font-size="44" font-weight="800" fill="url(#goldText)" letter-spacing="-0.5">Exhibition 2026</text>

    <!-- Tagline & Description -->
    <text x="0" y="172" font-family="'DM Sans', sans-serif" font-size="17" font-weight="500" fill="rgba(255,255,255,0.85)">
      Theme: "Innovating for Tomorrow — Young Minds, Global Perspectives"
    </text>

    <!-- Event Highlights Strips -->
    <g transform="translate(0, 205)">
      <rect x="0" y="0" width="190" height="38" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
      <text x="95" y="24" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">📅 Nov 14–16, 2026</text>

      <rect x="205" y="0" width="190" height="38" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
      <text x="300" y="24" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">📍 School Campus</text>

      <rect x="410" y="0" width="220" height="38" rx="10" fill="rgba(217,170,69,0.18)" stroke="#d9aa45" stroke-width="1.2"/>
      <text x="520" y="24" font-family="'DM Sans', sans-serif" font-size="13" font-weight="800" fill="#fceda4" text-anchor="middle">★ Open to Parents &amp; Visitors</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="415" width="1500" height="5" fill="url(#goldText)"/>
</svg>
