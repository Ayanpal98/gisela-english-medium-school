<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420" width="750" height="420">
  <defs>
    <linearGradient id="mBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2018"/>
      <stop offset="50%" stop-color="#102f24"/>
      <stop offset="100%" stop-color="#164635"/>
    </linearGradient>
    <linearGradient id="mGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d9aa45"/>
      <stop offset="100%" stop-color="#b88426"/>
    </linearGradient>
    <radialGradient id="mGlow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#2ca16f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#102f24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="750" height="420" fill="url(#mBgGrad)"/>
  <rect width="750" height="420" fill="url(#mGrid)"/>
  <rect width="750" height="420" fill="url(#mGlow)"/>

  <!-- Centered / Right decorative motif for mobile -->
  <g opacity="0.3" transform="translate(480, 80)">
    <circle cx="100" cy="100" r="110" fill="none" stroke="#d9aa45" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle cx="100" cy="100" r="140" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
  </g>
  <g transform="translate(560, 140)">
    <rect x="0" y="0" width="100" height="110" rx="22" fill="#0d251d" stroke="#d9aa45" stroke-width="1.5" opacity="0.8"/>
    <circle cx="50" cy="46" r="30" fill="#164635" stroke="#f5d77f" stroke-width="1"/>
    <path d="M 36 50 Q 50 42 50 56 Q 50 42 64 50 L 64 38 Q 50 30 50 44 Q 50 30 36 38 Z" fill="#f5d77f"/>
    <rect x="18" y="86" width="64" height="14" rx="7" fill="url(#mGoldGrad)"/>
    <text x="50" y="96" font-family="'Manrope', sans-serif" font-size="7.5" font-weight="800" fill="#102f24" text-anchor="middle" letter-spacing="1">ESTD 2003</text>
  </g>
